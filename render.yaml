services:
  # ═════════════════════════════════════════════════════════════════════════
  # TitanCode FastAPI Backend Web Service + In-Container Celery Worker
  # ═════════════════════════════════════════════════════════════════════════
  # Runs Alembic migrations, the Celery background worker, and Gunicorn/Uvicorn
  # in a single container on Render's $7/month Starter plan.
  # Database is hosted on Neon (Free forever) and Redis on Upstash (Free forever).
  # ═════════════════════════════════════════════════════════════════════════
  - type: web
    name: titancode-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: AUTO_SEED_DEFAULT_ADMIN
        value: "true"
      - key: FIRST_SUPERUSER
        value: admin@titancode.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false # Set in Render dashboard (e.g. YourSecurePassword2026!)
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a 256-bit secure key
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL connection string (with ?sslmode=require)
      - key: REDIS_URL
        sync: false # Paste your Upstash Redis connection string (rediss://...)
      - key: BACKEND_CORS_ORIGINS
        sync: false # Paste your Vercel frontend URL (e.g. https://your-app.vercel.app,http://localhost:5173)
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PORT
        value: "8000"
