services:
  # ═════════════════════════════════════════════════════════════════════════
  # TitanCode FastAPI Backend Web Service + In-Container Celery Worker
  # ═════════════════════════════════════════════════════════════════════════
  # Runs Alembic migrations, Celery background worker, and Gunicorn/Uvicorn
  # in a single container on Render's 100% Free Plan ($0/month).
  # Database is hosted on Neon (Free) and Redis on Upstash (Free).
  # ═════════════════════════════════════════════════════════════════════════
  - type: web
    name: titancode-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: AUTO_SEED_DEFAULT_ADMIN
        value: "true"
      - key: FIRST_SUPERUSER
        value: admin@titancode.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false # Set in Render dashboard (e.g. YourSecurePassword2026!)
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a 256-bit secure key
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL connection string
      - key: REDIS_URL
        sync: false # Paste your Upstash Redis connection string
      - key: BACKEND_CORS_ORIGINS
        sync: false # Paste: https://titancode-frontend-six.vercel.app,http://localhost:5173
      - key: STORAGE_TYPE
        value: "s3"
      - key: USE_S3
        value: "true"
      - key: S3_BUCKET
        value: "assets"
      - key: S3_REGION
        value: "us-east-1"
      - key: AWS_ENDPOINT_URL_S3
        sync: false # https://br-raspy-sun-b74zrd88.storage.c-13.us-east-1.aws.neon.tech
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: PORT
        value: "8000"
