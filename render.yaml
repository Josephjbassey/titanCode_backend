services:
  # ── TitanCode FastAPI Backend Web Service ──────────────────────────────
  - type: web
    name: titancode-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: AUTO_SEED_DEFAULT_ADMIN
        value: "true"
      - key: FIRST_SUPERUSER
        value: admin@titancode.com
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false # Set a strong, non-default password in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: titancode-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: titancode-redis
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        sync: false # Set to your Vercel frontend URL (e.g. https://your-app.vercel.app)
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PORT
        value: "8000"

  # ── Redis Key-Value for PubSub & Caching ────────────────────────────────
  - type: redis
    name: titancode-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  # ── PostgreSQL Managed Database ─────────────────────────────────────────
  - name: titancode-db
    plan: starter
    region: oregon
    databaseName: titancode
    user: postgres
