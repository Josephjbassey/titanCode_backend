<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TitanCode Live Events Monitor</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        h2 { color: #58a6ff; border-bottom: 2px solid #30363d; padding-bottom: 12px; margin-top: 0; }
        .description { color: #8b949e; margin-bottom: 24px; font-size: 0.95rem; }
        .controls { 
            background: #161b22; 
            padding: 20px; 
            border: 1px solid #30363d; 
            border-radius: 8px;
            margin-bottom: 24px; 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
        }
        .input-group { display: flex; gap: 10px; align-items: center; }
        label { font-weight: 600; min-width: 100px; color: #8b949e; font-size: 0.85rem; text-transform: uppercase; }
        input {
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            flex-grow: 1;
            border-radius: 6px;
            font-family: inherit;
        }
        .buttons { display: flex; gap: 10px; justify-content: flex-end; }
        button {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        button.connect { background: #238636; color: white; }
        button.connect:hover { background: #2ea043; }
        button.disconnect { background: transparent; border: 1px solid #f85149; color: #f85149; }
        button.disconnect:hover { background: #b62324; color: white; }
        
        #terminal {
            background: #010409;
            border: 1px solid #30363d;
            height: 450px;
            padding: 20px;
            overflow-y: auto;
            border-radius: 8px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .log-entry { margin-bottom: 10px; font-family: 'JetBrains Mono', 'Courier New', monospace; line-height: 1.5; font-size: 0.9rem; }
        .timestamp { color: #8b949e; margin-right: 12px; opacity: 0.7; }
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-right: 10px; text-transform: uppercase; }
        .tag-sys { background: #30363d; color: #c9d1d9; }
        .tag-event { background: #1f6feb; color: white; }
        .tag-err { background: #da3633; color: white; }
        .event-data { color: #3fb950; display: block; margin-top: 5px; padding-left: 20px; border-left: 2px solid #238636; white-space: pre-wrap; }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>

    <h2>TitanCode Real-Time Monitor</h2>
    <p class="description">Listen for live events from the TitanCode Backend. Token is required for authentication.</p>
    
    <div class="controls">
        <div class="input-group">
            <label for="authInput">JWT Token</label>
            <input type="password" id="authInput" placeholder="Paste your Access Token here...">
        </div>
        <div class="buttons">
            <button class="disconnect" onclick="disconnect()">Disconnect</button>
            <button class="connect" onclick="connect()">Start Monitoring</button>
        </div>
    </div>

    <div id="terminal"></div>

    <script>
        let ws;

        function connect() {
            const token = document.getElementById('authInput').value;
            if (!token) {
                alert("Please enter a JWT token. You can get one from /api/v1/auth/login in Swagger.");
                return;
            }

            // TITANCODE ENDPOINT: Using query parameter for authentication
            const wsUrl = `ws://localhost:8000/api/v1/notifications/ws?token=${token}`; 
            
            if (ws) ws.close();
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => writeToTerminal("sys", "Handshake successful. Listening for TitanCode events...");
            
            ws.onmessage = (event) => {
                let displayData = event.data;
                try {
                    const parsed = JSON.parse(event.data);
                    displayData = JSON.stringify(parsed, null, 2);
                } catch (e) {}
                
                writeToTerminal("event", `<span class="event-data">${displayData}</span>`);
            };
            
            ws.onclose = (event) => {
                const reason = event.reason || "Server closed the connection.";
                writeToTerminal("sys", `Connection closed. (Code: ${event.code}, Reason: ${reason})`);
            };
            
            ws.onerror = (error) => writeToTerminal("err", "WebSocket connection failed. Ensure the server is running and the token is valid.");
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function writeToTerminal(type, message) {
            const terminal = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString();
            const tagClass = `tag tag-${type}`;
            
            terminal.innerHTML += `
                <div class="log-entry">
                    <span class="timestamp">${time}</span>
                    <span class="${tagClass}">${type}</span>
                    ${message}
                </div>
            `;
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
